<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner App</title>
    <meta name="description"
        content="A web Page for teachers. Write a phrase and get ne number of letters you need to your banner!">
    <meta name="author" content="WDD330 | Emmanuel Bulacio">
    <link rel="icon" href="images/fav-icon.png">

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300&display=swap" rel="stylesheet">

    <!-- STYLES -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/siteplan.css">
    <link rel="stylesheet" href="styles/banner.css">

    <!-- OPEN GRAPH -->
    <meta property="og:title" content="Banner App">
    <meta property="og:description"
        content="The site is aimed to teachers who need to prepare banners.">
    <meta property="og:image" content="https://emmanuelbulacio4.github.io/wdd231/final/bannerapp-og.jpg">
    <meta property="og:url" content="https://emmanuelbulacio4.github.io/wdd231/final/bannerapp.html">

    <!-- SCRIPTS -->
    <script src="scripts/banner.js" defer></script>
</head>

<body>
    <header>
        <img id="icon" src="images/hat-icon.svg" alt="a graduation hat icon" width="50" height="50">
        <h1>School Classroom - Banner App</h1>
    </header>
    <main>
        <!-- <img src="images/hero-banner.webp" alt="space to sponsor" class="sponsor" loading="lazy"> -->
        <div class="application">
            <h2>Banner App</h2>
            <label for="userInput">Write/Paste the phrase: </label>
            <textarea name="input" id="userInput"></textarea>
            <button class="appButton">Count Letters</button>
            <ul id="list"></ul>
        </div>
        <div>
            <form method="get" action="opinion.html" class="wf1">
                <h2>Rate the app</h2>
                <fieldset>
                    <legend>Overall Rating <span class="asteric">*</span></legend>
                    <label><input type="radio" name="punctuation" value="five" required>⭐⭐⭐⭐⭐</label>
                    <label><input type="radio" name="punctuation" value="four">⭐⭐⭐⭐</label>
                    <label><input type="radio" name="punctuation" value="three">⭐⭐⭐</label>
                    <label><input type="radio" name="punctuation" value="two">⭐⭐</label>
                    <label><input type="radio" name="punctuation" value="one">⭐</label>
                </fieldset>
                <fieldset>
                    <label>Written Review (Optional)
                        <textarea name="wreview" id="written"></textarea>
                    </label>
                    <label>Your Name(Optional)<input type="text" placeholder="Your Name"></label>
                </fieldset>
                <input type="submit" value="Give my opinion">
            </form>
        </div>
    </main>
    <footer>
        <div>
            <p><a href="#" target="_blank">Video Demostration</a></p>
        </div>

        <div class="social">
            <a href="https://youtube.com" target="_blank"><img src="images/youtube.svg" alt="YouTube Logo" width="16"
                    height="16"></a>
            <a href="https://www.x.com" target="_blank"><img src="images/twitter.svg" alt="Twitter Logo" width="16"
                    height="16"></a>
            <a href="https://www.linkedin.com/in/emmanuel-bulacio/" target="_blank"><img src="images/linkedin.svg"
                    alt="LinkeIn Logo" width="16" height="16"></a>
        </div>

        <div>
            <p>&<span id="currentyear"></span> Emmanuel Bulacio - Salta, Argentina</p>
            <p>Last Modification: <span id="lastModified"></span></p>
        </div>

    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project | Emmanuel Bulacio | WDD330 Web Frontend Development II</title>
    <meta name="description"
        content="A web Page for parents. They can access to chronogram o classes and see assignments.">
    <meta name="author" content="WDD330 | Emmanuel Bulacio">
    <link rel="icon" href="images/fav-icon.png">

    <!-- GOOGLE FONTS LINKS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75..100,300&display=swap&subset=latin"
        rel="stylesheet">

    <!-- CSS FILES -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/siteplan.css">

    <!-- OPEN GRAPH -->
    <meta property="og:title" content="School Classroom Site">
    <meta property="og:description"
        content="A web aimed to parents and teachers. It helps both to follow up assignments and get guide from tutors.">
    <meta property="og:image" content="https://emmanuelbulacio4.github.io/wdd231/final/final-index-og.jpg">
    <meta property="og:url" content="https://emmanuelbulacio4.github.io/wdd231/final/index.html">

    <!-- SCRIPTS -->
    <script src="scripts/siteplan.js" type="module"></script>
</head>

<body>
    <header id="header">

        
    </header>

    <main class="viewer">
        <section class="site-sec">
            <h2>Student Site</h2>
        </section>
        <div class="lists">
            <ul id="classes">
                <li><a class="not-yet Seventh" href="#">Class 7 (soon)</a></li>
                <li><a class="not-yet Sixth" href="#">Class 6(soon)</a></li>
                <li><a class="Fifth" href="#">Class 5</a></li>
                <li><a class="Fourth" href="#">Class 4</a></li>
                <li><a class="not-yet Third" href="#">Class 3 (soon)</a></li>
                <li><a class="not-yet Second" href="#">Class 2 (soon)</a></li>
                <li><a class="not-yet First" href="#">Class 1 (soon)</a></li>
            </ul>
        </div>
        <img class="hero" src="images/default500x1000.jpg" alt="a little dog inviting to choose the class" width="250"
            loading="lazy">
        <div id="chrono"></div>
        <dialog id="coming-soon">
            <h2>🚨🚨NOTICE🚨🚨</h2>
            <p>We are working on lunching this feature.</p>
            <button id="closeModal">CLOSE</button>
        </dialog>
        <div class="w-card">
            <h3>Forecast</h3>
            <p id="done"></p>
            <p id="one"></p><br>
            <p id="dtwo"></p>
            <p id="two"></p><br>
            <p id="dthree"></p>
            <p id="three"></p><br>
        </div>
    </main>

    <footer id="footer"></footer>

    <template id="header-template">
        <img id="icon" width="50" height="50">
        <h1 id="title"></h1>
        <button aria-label="Menu Button" id="hamburger"></button>
        <nav id="nav-bar" class="navigation">
            <ul id="nav-list">
            </ul>
        </nav>
    </template>

    <template id="footer-template">
        <div id="videodemo">
        <p><a id="video-link" href="#" target="_blank">Video Demonstration</a><p>
        </div>
        <div class="social" id="social-link"></div>
        <div>
            <p>&copy; <span id="currentyear"></span> <span id="author-info"></span></p>
            <p>Last Modification: <span id="lastModified"></span></p>
        </div>
    </template>

</body>

</html>
